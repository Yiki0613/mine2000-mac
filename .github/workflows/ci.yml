name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Build & Test (macOS 15)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build --disable-sandbox

      - name: Unit tests (129)
        run: swift test --disable-sandbox

      - name: Logic self-test (46)
        run: ./.build/debug/Mine2000 --selftest "$RUNNER_TEMP/selftest.txt"

      # GUI 自检需要离屏渲染 AppKit 视图。GitHub 的 macOS runner 通常有图形会话，
      # 但偶发拿不到 NSApplication，因此这一步不阻塞 badge —— 失败时看日志判断
      # 是环境问题还是真的回归。
      - name: GUI self-test (16)
        continue-on-error: true
        run: ./.build/debug/Mine2000 --gui-selftest "$RUNNER_TEMP/gui_selftest"

      - name: Upload GUI test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-selftest
          path: ${{ runner.temp }}/gui_selftest
          if-no-files-found: ignore
